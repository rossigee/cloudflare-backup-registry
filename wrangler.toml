name = "backup-registry"
compatibility_date = "2025-04-01"
main = "src/index.ts"
workers_dev = false

[[durable_objects.bindings]]
name = "BACKUP_STORE"
class_name = "BackupRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackupRegistry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v3"
deleted_classes = ["RateLimiter"]

# Site-specific config (non-secret). Secrets stored in Cloudflare via:
#   wrangler secret put OIDC_CLIENT_SECRET --env <site>
#   wrangler secret put API_TOKENS --env <site>

[env.golder]
account_id = "c1b74f148aee28025816e104a92622c5"
routes = [{ pattern = "backups.golder.tech", custom_domain = true }]
vars = { SITE_NAME = "Golder Backups", JWT_ISSUER = "https://sso.golder.tech/auth/realms/ROSSGolderLtd", JWT_AUDIENCE = "backups-registry", BASE_URL = "https://backups.golder.tech", API_TOKENS = "d6b54bcdaf61916f0c475910459966d733b9f8ae9d952ef8" }

[[env.golder.bindings]]
name = "OIDC_CLIENT_SECRET"
type = "secret_text"

[[env.golder.durable_objects.bindings]]
name = "BACKUP_STORE"
class_name = "BackupRegistry"

[env.wardle]
account_id = "c319c02aa39a98bfaaad068b83c0b179"
routes = [{ pattern = "backups.wardle.online", custom_domain = true }]
vars = { SITE_NAME = "Wardle Backups", JWT_ISSUER = "https://sso.wardle.online/auth/realms/Wardle", JWT_AUDIENCE = "backups-registry", BASE_URL = "https://backups.wardle.online" }

[[env.wardle.bindings]]
name = "OIDC_CLIENT_SECRET"
type = "secret_text"

[[env.wardle.durable_objects.bindings]]
name = "BACKUP_STORE"
class_name = "BackupRegistry"

[env.timewarp]
account_id = "bd32abceb7ddba1b066a11732ae38c2f"
routes = [{ pattern = "backups.timewarp.ws", custom_domain = true }]
vars = { SITE_NAME = "Timewarp Backups", JWT_ISSUER = "https://sso.timewarp.ws/auth/realms/Timewarp", JWT_AUDIENCE = "backups-registry", BASE_URL = "https://backups.timewarp.ws" }

[[env.timewarp.bindings]]
name = "OIDC_CLIENT_SECRET"
type = "secret_text"

[[env.timewarp.durable_objects.bindings]]
name = "BACKUP_STORE"
class_name = "BackupRegistry"

[env.testing]
vars = { AUTH_USER = "${AUTH_USER}", AUTH_PASS = "${AUTH_PASS}", API_TOKENS = "${API_TOKENS}" }

[[env.testing.durable_objects.bindings]]
name = "BACKUP_STORE"
class_name = "BackupRegistry"