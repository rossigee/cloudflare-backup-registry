name: Deploy

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy (${{ matrix.env }})
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: golder
            optional: false
          - env: wardle
            optional: false
          - env: timewarp
            optional: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Create wrangler config from secrets
        run: |
          mkdir -p sites
          ENV_UPPER=$(echo "${{ matrix.env }}" | tr '[:lower:]' '[:upper:]')
          CONFIG_VAR="WRANGLER_CONFIG_${ENV_UPPER}"
          echo "${!CONFIG_VAR}" > sites/wrangler.${{ matrix.env }}.toml
        env:
          WRANGLER_CONFIG_GOLDER: ${{ secrets.WRANGLER_CONFIG_GOLDER }}
          WRANGLER_CONFIG_WARDLE: ${{ secrets.WRANGLER_CONFIG_WARDLE }}
          WRANGLER_CONFIG_TIMEWARP: ${{ secrets.WRANGLER_CONFIG_TIMEWARP }}

      - name: Deploy to ${{ matrix.env }}
        run: |
          ENV_UPPER=$(echo "${{ matrix.env }}" | tr '[:lower:]' '[:upper:]')
          TOKEN_VAR="CF_API_TOKEN_${ENV_UPPER}"
          CLOUDFLARE_API_TOKEN="${!TOKEN_VAR:-$CF_API_TOKEN_DEFAULT}" npx wrangler deploy --env ${{ matrix.env }} -c sites/wrangler.${{ matrix.env }}.toml
        env:
          CF_API_TOKEN_DEFAULT: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN_GOLDER: ${{ secrets.CF_API_TOKEN_GOLDER }}
          CF_API_TOKEN_WARDLE: ${{ secrets.CF_API_TOKEN_WARDLE }}
          CF_API_TOKEN_TIMEWARP: ${{ secrets.CF_API_TOKEN_TIMEWARP }}
